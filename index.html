<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Learning</title>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161922;
    --surface-2: #1e2130;
    --border: #252836;
    --border-2: #2e3247;
    --text: #e2e8f0;
    --text-muted: #64748b;
    --text-dim: #94a3b8;
    --accent: #5eead4;
    --accent-dim: rgba(94,234,212,0.12);
    --amber: #f59e0b;
    --amber-dim: rgba(245,158,11,0.12);
    --green: #4ade80;
    --green-dim: rgba(74,222,128,0.1);
    --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', ui-monospace, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  :root[data-theme="light"] {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --surface-2: #f7f8fa;
    --border: #e2e6ed;
    --border-2: #d1d7e0;
    --text: #111827;
    --text-muted: #6b7280;
    --text-dim: #9ca3af;
    --accent: #0d9488;
    --accent-dim: rgba(13,148,136,0.1);
    --amber: #d97706;
    --amber-dim: rgba(217,119,6,0.1);
    --green: #16a34a;
    --green-dim: rgba(22,163,74,0.1);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --surface-2: #f7f8fa;
      --border: #e2e6ed;
      --border-2: #d1d7e0;
      --text: #111827;
      --text-muted: #6b7280;
      --text-dim: #9ca3af;
      --accent: #0d9488;
      --accent-dim: rgba(13,148,136,0.1);
      --amber: #d97706;
      --amber-dim: rgba(217,119,6,0.1);
      --green: #16a34a;
      --green-dim: rgba(22,163,74,0.1);
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .header-left {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  h1 {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .date-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .progress-summary {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
  }
  .progress-summary span { color: var(--accent); font-weight: 600; }
  .theme-btn {
    background: none;
    border: 1px solid var(--border-2);
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-family: var(--mono);
    transition: color 0.15s, border-color 0.15s;
  }
  .theme-btn:hover { color: var(--text); border-color: var(--text-dim); }

  /* Main layout */
  main {
    display: grid;
    grid-template-columns: 1fr 320px;
    flex: 1;
    overflow: hidden;
    gap: 0;
  }

  /* Backlog panel */
  .backlog {
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    scrollbar-width: thin;
    scrollbar-color: var(--border-2) transparent;
  }
  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 8px 4px 4px;
    margin-top: 8px;
  }
  .section-label:first-child { margin-top: 0; }

  /* Topic card */
  .topic {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .topic:hover { border-color: var(--border-2); }
  .topic.open { border-color: var(--border-2); }

  .topic-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    cursor: pointer;
    user-select: none;
  }
  .topic-chevron {
    font-size: 10px;
    color: var(--text-muted);
    transition: transform 0.15s;
    flex-shrink: 0;
    width: 12px;
    text-align: center;
  }
  .topic.open .topic-chevron { transform: rotate(90deg); }
  .topic-name {
    flex: 1;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
  }
  .topic-meta {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .subtopic-count {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
  }
  .status-chip {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    padding: 2px 7px;
    border-radius: 3px;
    font-weight: 500;
  }
  .status-done { background: var(--green-dim); color: var(--green); }
  .status-in-progress { background: var(--amber-dim); color: var(--amber); }
  .status-not-started { background: rgba(100,116,139,0.12); color: var(--text-muted); }

  /* Subtopics */
  .subtopics {
    display: none;
    padding: 0 12px 10px;
    border-top: 1px solid var(--border);
  }
  .topic.open .subtopics { display: block; }

  .subtopic-group-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 8px 0 4px;
  }
  .subtopic-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
  }
  .subtopic-item + .subtopic-item {
    border-top: 1px solid var(--border);
  }
  .subtopic-name {
    flex: 1;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .subtopic-name.done-text {
    color: var(--text-muted);
    text-decoration: line-through;
  }
  .btn-add-today {
    background: none;
    border: 1px solid var(--border-2);
    color: var(--text-muted);
    cursor: pointer;
    padding: 2px 7px;
    border-radius: 3px;
    font-size: 10px;
    font-family: var(--mono);
    white-space: nowrap;
    transition: all 0.12s;
    flex-shrink: 0;
  }
  .btn-add-today:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .btn-add-today.added {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-dim);
  }
  .subtopic-status {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--green);
    flex-shrink: 0;
  }

  /* Today panel */
  .today-panel {
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--surface);
  }
  .today-header {
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .today-title {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .today-progress {
    height: 2px;
    background: var(--border);
    border-radius: 1px;
    overflow: hidden;
    margin-top: 8px;
  }
  .today-progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 1px;
    transition: width 0.3s ease;
  }
  .today-progress-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .today-progress-label span { color: var(--accent); }

  .today-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
    scrollbar-width: thin;
    scrollbar-color: var(--border-2) transparent;
  }
  .today-empty {
    padding: 32px 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.7;
  }
  .today-empty strong {
    display: block;
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 6px;
  }

  .today-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  .today-item:last-child { border-bottom: none; }
  .today-item.checked { background: var(--surface-2); }

  .check-btn {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    border: 1.5px solid var(--border-2);
    background: none;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: transparent;
    transition: all 0.12s;
  }
  .check-btn:hover { border-color: var(--accent); }
  .today-item.checked .check-btn {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }

  .today-item-content { flex: 1; min-width: 0; }
  .today-item-topic {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    margin-bottom: 1px;
  }
  .today-item-name {
    font-size: 12.5px;
    color: var(--text);
    line-height: 1.4;
  }
  .today-item.checked .today-item-name {
    color: var(--text-muted);
    text-decoration: line-through;
  }

  .today-item-remove {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0;
    opacity: 0;
    transition: opacity 0.1s, color 0.1s;
    flex-shrink: 0;
  }
  .today-item:hover .today-item-remove { opacity: 1; }
  .today-item-remove:hover { color: var(--text); }

  .today-footer {
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .btn-clear {
    background: none;
    border: 1px solid var(--border-2);
    color: var(--text-muted);
    cursor: pointer;
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-family: var(--mono);
    width: 100%;
    transition: all 0.12s;
  }
  .btn-clear:hover { border-color: var(--text-muted); color: var(--text); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }

  @media (max-width: 680px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .today-panel { border-left: none; border-top: 1px solid var(--border); }
    body { overflow: auto; }
    main { overflow: visible; }
    .backlog, .today-list { overflow: visible; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>MyLearning</h1>
    <span class="date-label" id="dateLabel"></span>
  </div>
  <div class="header-right">
    <span class="progress-summary" id="progressSummary"></span>
    <button class="theme-btn" onclick="toggleTheme()">theme</button>
  </div>
</header>

<main>
  <div class="backlog" id="backlog"></div>
  <div class="today-panel">
    <div class="today-header">
      <div class="today-title">Today's focus</div>
      <div class="today-progress-label"><span id="todayDone">0</span> / <span id="todayTotal">0</span> done</div>
      <div class="today-progress"><div class="today-progress-bar" id="progressBar" style="width:0%"></div></div>
    </div>
    <div class="today-list" id="todayList"></div>
    <div class="today-footer">
      <button class="btn-clear" onclick="clearToday()">clear today's list</button>
    </div>
  </div>
</main>

<script>
const DATA_URL = 'https://raw.githubusercontent.com/Veekash2/MyLearning/main/data.json';

let state = {
  topics: [],
  subtopicStatus: {}, // { "topicId::subtopic": "learning" | "learned" }
  today: [],          // [{ topicId, topicTitle, name, checked }]
};

// Load from localStorage, then fetch fresh data
function loadState() {
  const saved = localStorage.getItem('mylearning_state');
  if (saved) {
    try { state = JSON.parse(saved); } catch(e) {}
  }
}
function saveState() {
  localStorage.setItem('mylearning_state', JSON.stringify(state));
}

function key(topicId, name) { return topicId + '::' + name; }

function getSubtopicStatus(topicId, name) {
  return state.subtopicStatus[key(topicId, name)] || 'to-learn';
}
function setSubtopicStatus(topicId, name, status) {
  state.subtopicStatus[key(topicId, name)] = status;
  saveState();
}

function isInToday(topicId, name) {
  return state.today.some(t => t.topicId === topicId && t.name === name);
}
function addToToday(topicId, topicTitle, name) {
  if (!isInToday(topicId, name)) {
    state.today.push({ topicId, topicTitle, name, checked: false });
    saveState();
  }
}
function removeFromToday(topicId, name) {
  state.today = state.today.filter(t => !(t.topicId === topicId && t.name === name));
  saveState();
}
function toggleTodayCheck(topicId, name) {
  const item = state.today.find(t => t.topicId === topicId && t.name === name);
  if (item) { item.checked = !item.checked; saveState(); }
}
function clearToday() {
  state.today = [];
  saveState();
  render();
}

// Compute topic status from subtopic statuses
function computeTopicStatus(topic) {
  const all = [...topic.learned, ...topic.learning, ...topic.toLearn];
  if (all.length === 0) return topic.status;
  const learnedCount = all.filter(n => getSubtopicStatus(topic.id, n) === 'learned').length;
  const learningCount = all.filter(n => getSubtopicStatus(topic.id, n) === 'learning').length;
  if (learnedCount === all.length) return 'done';
  if (learnedCount > 0 || learningCount > 0 || topic.status === 'in-progress') return 'in-progress';
  return 'not-started';
}

function statusLabel(s) {
  if (s === 'done') return 'done';
  if (s === 'in-progress') return 'in progress';
  return 'not started';
}
function statusClass(s) {
  if (s === 'done') return 'status-done';
  if (s === 'in-progress') return 'status-in-progress';
  return 'status-not-started';
}

function renderBacklog() {
  const el = document.getElementById('backlog');
  const groups = {};
  state.topics.forEach(t => {
    if (!groups[t.group]) groups[t.group] = [];
    groups[t.group].push(t);
  });
  const groupOrder = ['topics', 'books-certs'];
  const groupLabels = { 'topics': 'Topics', 'books-certs': 'Books & Certs' };
  let html = '';
  groupOrder.forEach(g => {
    if (!groups[g]) return;
    html += `<div class="section-label">${groupLabels[g] || g}</div>`;
    groups[g].forEach(topic => {
      const allSubs = [...(topic.learned||[]), ...(topic.learning||[]), ...(topic.toLearn||[])];
      const status = computeTopicStatus(topic);
      const learnedCount = allSubs.filter(n => getSubtopicStatus(topic.id, n) === 'learned').length;
      const open = topic._open ? 'open' : '';
      html += `<div class="topic ${open}" id="topic-${topic.id}">
        <div class="topic-header" onclick="toggleTopic('${topic.id}')">
          <span class="topic-chevron">▶</span>
          <span class="topic-name">${topic.title}</span>
          <span class="topic-meta">
            ${allSubs.length > 0 ? `<span class="subtopic-count">${learnedCount}/${allSubs.length}</span>` : ''}
            <span class="status-chip ${statusClass(status)}">${statusLabel(status)}</span>
          </span>
        </div>
        <div class="subtopics">
          ${renderSubtopics(topic)}
        </div>
      </div>`;
    });
  });
  el.innerHTML = html;
}

function renderSubtopics(topic) {
  const sections = [
    { items: topic.learned || [], label: 'Learned' },
    { items: topic.learning || [], label: 'Currently learning' },
    { items: topic.toLearn || [], label: 'To learn' },
  ].filter(s => s.items.length > 0);

  // If no sections, show empty
  if (sections.length === 0) return '<div style="padding:8px 0;color:var(--text-muted);font-size:12px;">No subtopics yet.</div>';

  let html = '';
  sections.forEach(section => {
    html += `<div class="subtopic-group-label">${section.label}</div>`;
    section.items.forEach(name => {
      const subStatus = getSubtopicStatus(topic.id, name);
      const inToday = isInToday(topic.id, name);
      const isDone = subStatus === 'learned';
      html += `<div class="subtopic-item">
        <span class="subtopic-name ${isDone ? 'done-text' : ''}">${name}</span>
        ${isDone
          ? `<span class="subtopic-status">✓</span>`
          : `<button class="btn-add-today ${inToday ? 'added' : ''}"
              onclick="handleAddToday('${topic.id}', '${escQ(topic.title)}', '${escQ(name)}')"
            >${inToday ? 'added' : '+ today'}</button>`
        }
      </div>`;
    });
  });
  return html;
}

function escQ(s) { return s.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

function renderToday() {
  const list = document.getElementById('todayList');
  const done = state.today.filter(t => t.checked).length;
  const total = state.today.length;
  document.getElementById('todayDone').textContent = done;
  document.getElementById('todayTotal').textContent = total;
  document.getElementById('progressBar').style.width = total > 0 ? (done/total*100)+'%' : '0%';

  if (state.today.length === 0) {
    list.innerHTML = `<div class="today-empty">
      <strong>Nothing here yet</strong>
      Open a topic on the left and hit <em>+ today</em> on any subtopic to add it here.
    </div>`;
    return;
  }

  list.innerHTML = state.today.map(item => `
    <div class="today-item ${item.checked ? 'checked' : ''}">
      <button class="check-btn" onclick="handleCheck('${item.topicId}', '${escQ(item.name)}')">✓</button>
      <div class="today-item-content">
        <div class="today-item-topic">${item.topicTitle}</div>
        <div class="today-item-name">${item.name}</div>
      </div>
      <button class="today-item-remove" onclick="handleRemove('${item.topicId}', '${escQ(item.name)}')">×</button>
    </div>
  `).join('');
}

function renderProgress() {
  const done = state.topics.filter(t => computeTopicStatus(t) === 'done').length;
  const inprog = state.topics.filter(t => computeTopicStatus(t) === 'in-progress').length;
  document.getElementById('progressSummary').innerHTML =
    `<span>${done}</span> done · <span style="color:var(--amber)">${inprog}</span> in progress`;
}

function render() {
  renderBacklog();
  renderToday();
  renderProgress();
}

function toggleTopic(id) {
  const topic = state.topics.find(t => t.id === id);
  if (topic) { topic._open = !topic._open; }
  renderBacklog();
}

function handleAddToday(topicId, topicTitle, name) {
  if (isInToday(topicId, name)) {
    removeFromToday(topicId, name);
  } else {
    addToToday(topicId, topicTitle, name);
  }
  render();
}

function handleCheck(topicId, name) {
  toggleTodayCheck(topicId, name);
  render();
}

function handleRemove(topicId, name) {
  removeFromToday(topicId, name);
  render();
}

function toggleTheme() {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
}

function setDateLabel() {
  const now = new Date();
  const label = now.toLocaleDateString('en-NZ', { weekday: 'short', day: 'numeric', month: 'short' });
  document.getElementById('dateLabel').textContent = label;
}

async function fetchData() {
  try {
    const res = await fetch(DATA_URL);
    const data = await res.json();
    // Merge fresh topics in — preserve _open and subtopicStatus
    const existing = {};
    state.topics.forEach(t => { existing[t.id] = t; });
    state.topics = data.topics.map(t => ({
      ...t,
      _open: existing[t.id] ? existing[t.id]._open : false,
    }));
    saveState();
    render();
  } catch(e) {
    // Use cached state if fetch fails
    console.warn('Could not fetch fresh data, using cached state.', e);
  }
}

// Init
loadState();
setDateLabel();
render();
fetchData();
</script>
</body>
</html>
